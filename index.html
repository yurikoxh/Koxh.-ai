<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koxh AI</title>
    <style>
        body { background-color: #131314; color: #e3e3e3; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        header { padding: 20px; font-size: 1.5rem; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
        #chat-area { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .input-box { width: 80%; max-width: 700px; background: #1e1f20; padding: 15px; border-radius: 25px; display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
        input[type="text"] { flex-grow: 1; background: transparent; border: none; color: white; outline: none; padding: 10px; }
        button { background: #444746; color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }
        .file-input { display: none; }
        .file-label { cursor: pointer; font-size: 1.2rem; }
    </style>
</head>
<body>

    <header>
        <div>Koxh</div>
        <button onclick="newChat()">New Chat +</button>
    </header>

    <div id="chat-area">
        <h1 id="greeting">Hi there, let's get into it.</h1>
        <div class="input-box">
            <label for="fileUpload" class="file-label">📎</label>
            <input type="file" id="fileUpload" class="file-input" multiple>
            <input type="text" id="userInput" placeholder="Ask Koxh anything...">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        // Handle New Chat
        function newChat() {
            document.getElementById('chat-area').innerHTML = "<h1>New Chat started.</h1>";
        }

        // Handle File Selection
        document.getElementById('fileUpload').addEventListener('change', function() {
            alert("File selected: " + this.files[0].name);
        });

        // Handle Sending Message
        function sendMessage() {
            const input = document.getElementById('userInput').value;
            if(input) {
                alert("You said: " + input);
                document.getElementById('userInput').value = '';
            }
        }
    </script>
</body>
</html>
